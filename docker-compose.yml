services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./server_out:/app/server_out
      - ./server_out_fedbn:/app/server_out_fedbn
      - ./runs:/app/runs
      - .:/app/host_data:ro
    environment:
      - SEPSIS_MODEL_PATH=/app/server_out/global_best.pt
      - SEPSIS_MODEL_TYPE=grud
      - SEPSIS_SCALER_PATH=/app/data/processed/patients/scaler.json

  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./server_out:/app/server_out
    environment:
      - SEPSIS_MODEL_PATH=/app/server_out/global_best.pt
      - SEPSIS_MODEL_TYPE=grud
      - SEPSIS_SCALER_PATH=/app/data/processed/patients/scaler.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
